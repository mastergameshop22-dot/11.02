<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME SHOP STORE GOLD HEN 11.02</title>
  <link rel="stylesheet" href="includes/style.css">
  <style>
    /* التنسيقات العامة */
    :root {
      --primary-color: #0070cc;
      --primary-hover: #005fa3;
      --panel-bg: rgba(26, 29, 39, 0.85);
      --text-color: #ffffff;
      --console-bg: #050505;
    }

    body {
      background: linear-gradient(135deg, #001533 0%, #000000 100%);
      background-attachment: fixed;
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* تنسيق اسم البراند */
    .brand-logo {
      font-size: 5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: var(--text-color);
      text-shadow: 0 0 20px rgba(0, 112, 204, 0.8), 0 0 40px rgba(0, 112, 204, 0.6);
      margin-top: 20px;
      margin-bottom: 5px;
      text-align: center;
    }

    .subtitle {
      color: #8892b0;
      font-size: 1.8rem;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }

    h3#UA {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 30px;
      font-weight: normal;
      text-align: center;
    }

    hr {
      width: 100%;
      max-width: 800px;
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
      margin-bottom: 40px;
    }

    .btn-container {
      background-color: var(--panel-bg);
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 100%;
      max-width: 450px;
      border: 1px solid rgba(0, 112, 204, 0.2);
      backdrop-filter: blur(5px);
    }

    #kernel-options {
      display: flex;
      gap: 20px;
      font-size: 1.2rem;
      color: #cbd5e1;
      font-weight: bold;
    }

    input[type="radio"] {
      accent-color: var(--primary-color);
      transform: scale(1.3);
      cursor: pointer;
    }

    label {
      cursor: pointer;
    }

    /* تنسيق زر Jailbreak */
    #jailbreak {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.6rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 112, 204, 0.5);
      width: 100%;
    }

    #jailbreak:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 25px rgba(0, 112, 204, 0.8);
      transform: translateY(-3px);
    }

    .autoJb {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      color: #94a3b8;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .main-layout {
      margin-top: 40px;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* تنسيق شاشة الأوامر */
    #console {
      background-color: var(--console-bg);
      color: #10b981;
      padding: 25px;
      border-radius: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      border: 1px solid #1e293b;
      min-height: 150px;
      overflow-x: auto;
      box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.9);
      margin: 0;
    }

    /* تنسيق بيانات التواصل (أرقام وعنوان) بنفس روح تصميم اللوجو */
    .contact-info {
      margin-top: 30px;
      text-align: center;
      background-color: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 112, 204, 0.2);
    }

    .contact-phones {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text-color);
      text-shadow: 0 0 10px rgba(0, 112, 204, 0.8), 0 0 20px rgba(0, 112, 204, 0.5);
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      direction: ltr;
    }

    .contact-address {
      font-size: 1.1rem;
      font-weight: bold;
      color: #cbd5e1;
      line-height: 1.6;
      text-shadow: 0 0 5px rgba(0, 112, 204, 0.4);
      direction: rtl;
    }
    
    /* استجابة الشاشات الصغيرة */
    @media (max-width: 768px) {
      .brand-logo {
        font-size: 3rem;
      }
      .contact-phones {
        font-size: 1.2rem;
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>
<body>

  <!-- اللوجو النصي الكبير في منتصف الصفحة -->
  <div class="brand-logo">GAME SHOP STORE</div>
  <div class="subtitle">GOLD HEN 11.02</div>
  <h3 id="UA">Running on:</h3>

  <hr>

  <div class="btn-container">
    <form id="kernel-options">
      <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl" checked>
      <label for="netctrl-exploit">NetCtrl</label>
      <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
      <label for="lapse-exploit">Lapse</label>
    </form>
    
    <button id="jailbreak">Jailbreak</button>
    
    <div class="autoJb">
      <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
      <input class="mt-2" id="autoJbInput" type="checkbox">
    </div>
  </div>

  <div class="main-layout">
    <pre id="console">Ready. Awaiting execution...
</pre>

    <!-- إضافة بيانات التواصل هنا -->
    <div class="contact-info">
      <div class="contact-phones">
        <span>01024388999</span> | 
        <span>01020244499</span> | 
        <span>0502370475</span>
      </div>
      <div class="contact-address">
        العنوان: 43 شارع الايمان من حى الجامعه، أول شارع بعد مول الجامعه بلازا، على اول الشارع مطعم هوت مكس
      </div>
    </div>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
